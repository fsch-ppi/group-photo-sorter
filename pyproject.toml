[project]
name = "photo-import-sorter"
version = "0.1.0"
description = "Photo and video conversion and distribution system for Nextcloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "django-cors-headers>=4.3",
    "celery[redis]>=5.3",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "pillow-heif>=0.15",
    "rawpy>=0.19",
    "imageio>=2.33",
    "requests>=2.31",
    "webdavclient3>=3.14",
    "python-dateutil>=2.8",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "social-auth-app-django>=5.4",
    "social-auth-core>=4.5",
    "pyjwt>=2.8",
    "django-ratelimit>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "black>=23.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "black>=23.0",
    "ruff>=0.1",
]
